<div class="sitebar" role="navigation" aria-label="Prototype sites">
  <span class="sitebar-note">Prototype preview of three separate sites</span>
  <div class="sitebar-tabs">
    <button data-act="site" data-site="main"><b>entrava.com</b><span>Fans</span></button>
    <button data-act="site" data-site="host"><b>host.entrava.com</b><span>Hosts</span></button>
    <button data-act="site" data-site="gate"><b>checkin.entrava.com</b><span>Check-in</span></button>
  </div>
</div>
<header class="top" id="top">
  <button class="brand" data-act="home" aria-label="Entrava home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 1.2l3.1 2.3 3.8-.5 1.5 3.5 3.5 1.5-.5 3.8 2.3 3.1-2.3 3.1.5 3.8-3.5 1.5-1.5 3.5-3.8-.5-3.1 2.3-3.1-2.3-3.8.5-1.5-3.5-3.5-1.5.5-3.8-2.3-3.1 2.3-3.1-.5-3.8 3.5-1.5 1.5-3.5 3.8.5z"/><path d="M10.4 16.3l3.7 3.7 7.5-8" fill="none" stroke="var(--bg)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" class="brand-tick"/></svg>
    Entrava<span class="site-tag" id="site-tag" hidden></span>
  </button>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="top-r" id="top-r"></div>
  <button class="theme" data-act="theme" id="theme-btn" aria-label="Switch to dark mode"></button>
</header>

<section class="hero" id="hero" hidden aria-label="Entrava">
  <canvas id="arena" aria-hidden="true"></canvas>
  <div class="hero-scrim"></div>
  <div class="hero-in">
    <h1>Tickets that can't be faked.</h1>
    <p class="hero-sub" id="hero-sub">Every ticket carries its own seal and a QR code that opens once. Buy in a minute, walk in with one scan.</p>
    <div class="hero-cta" id="hero-cta"></div>
  </div>
  <div class="hero-next" id="hero-next" hidden></div>
  <button class="hero-pause" id="hero-pause" data-act="arenaToggle" hidden>Pause motion</button>
</section>

<main id="app"><p class="loading">Loading shows…</p></main>
<footer class="foot"><div class="foot-in"><span id="foot"></span><span class="foot-links" id="foot-links">Pay with Paystack, Flutterwave or Stripe</span></div></footer>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
